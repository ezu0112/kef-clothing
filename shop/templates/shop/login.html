{% extends 'shop/home.html' %}

{% block title %}Нэвтрэх | KEF CLOTHING{% endblock %}

{% block content %}
<main class="auth-page">
    <section class="auth-card">
        <h1>Нэвтрэх</h1>

        {% if form.errors %}
        <p class="auth-error">
            Нэвтрэх нэр эсвэл нууц үг буруу байна.
        </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="loginUsername">Нэвтрэх нэр</label>
            <input id="loginUsername"
                   type="text"
                   name="username"
                   value="{{ form.username.value|default_if_none:'' }}"
                   autocomplete="username"
                   required>

            <label for="loginPassword">Нууц үг</label>
            <input id="loginPassword"
                   type="password"
                   name="password"
                   autocomplete="current-password"
                   required>

            {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
            {% endif %}

            <button class="black-button" type="submit">
                НЭВТРЭХ
            </button>
        </form>

        <div class="auth-divider">эсвэл</div>

        <a class="auth-secondary" href="{% url 'register' %}">
            Шинээр бүртгүүлэх
        </a>

        <a class="auth-secondary" href="{% url 'products' %}">
            Зочноор үргэлжлүүлэх
        </a>
    </section>
</main>
{% endblock %}
